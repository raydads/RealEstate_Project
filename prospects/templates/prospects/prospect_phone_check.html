{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Prospect</title>
    <link rel="stylesheet" href="{% static 'propertytrack/styles.css' %}">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="{% static 'propertytrack/logo_90.jpg' %}" alt="Logo">
        </div>
        <div class="user-info">
            <span>{{ request.user.username }}</span>
            <form action="{% url 'agents:logout' %}" method="post" style="margin: 0; margin-left: 20px;">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        </div>
    </div>

    <h1>{{ inspection.rental.address }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p><input type="tel" name="phone" placeholder="Phone number" required></p>
        <button type="submit">Check</button>
    </form>

    <a href="{% url 'propertytrack:in_inspection' inspection.rental.id %}"><button>Back</button></a>
</body>
</html>
