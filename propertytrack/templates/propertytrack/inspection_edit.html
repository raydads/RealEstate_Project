{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Inspection</title>
    <link rel="stylesheet" href="{% static 'propertytrack/styles.css' %}">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="{% static 'propertytrack/logo_90.jpg' %}" alt="Logo">
        </div>
        <div class="user-info">
            <span>{{ request.user.username }}</span>
            <form action="{% url 'agents:logout' %}" method="post" style="margin: 0; margin-left: 20px;">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        </div>
    </div>
    
    <h1>Edit Inspection</h1>
    
    <form method="POST">
        {% csrf_token %}
        <label>Status:</label>
        <select name="status">
            <option value="scheduled" {% if inspection.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
            <option value="in_progress" {% if inspection.status == 'in_progress' %}selected{% endif %}>In Progress</option>
            <option value="completed" {% if inspection.status == 'completed' %}selected{% endif %}>Completed</option>
        </select>
        
        <button type="submit">Save</button>
    </form>
    
    <a href="{% url 'propertytrack:inspection_detail' inspection.id %}"><button>Back</button></a>
</body>
</html>
