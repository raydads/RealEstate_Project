{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Create Property</title>
    <link rel="stylesheet" href="{% static 'propertytrack/styles.css' %}">
</head>
<body>
    <h1>Add New Property</h1>
    
    {% if messages %}
        {% for message in messages %}
            <p style="color: green;">{{ message }}</p>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit">Save</button>
            <a href="{% url 'propertytrack:home' %}"><button type="button">Back</button></a>
        </div>
    </form>
</html>
