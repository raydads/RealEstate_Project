{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rentals</title>
    <link rel="stylesheet" href="{% static 'propertytrack/styles.css' %}">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="{% static 'propertytrack/logo_90.jpg' %}" alt="Logo">
        </div>
        <div class="user-info">
            <span>{{ request.user.username }}</span>
            <form action="{% url 'agents:logout' %}" method="post" style="margin: 0; margin-left: 20px;">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        </div>
    </div>
    
    <div class="content">
        <h1>Rental Properties</h1>
        
        <a href="{% url 'propertytrack:rental_create' %}">
            <button>Add Property</button>
        </a>
        
        <table border="1" cellpadding="10">
            <tr>
                <th>Address</th>
                <th>Price/week</th>
                <th>Edit Details</th>
            </tr>
            {% for rental in rentals %}
            <tr>
                <td> {{ rental.address }}</td>
                <td>${{ rental.rent_amount }}</td>
                <td>
                    <a href="{% url 'propertytrack:rental_detail' rental.id %}">
                        <button>Edit</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
