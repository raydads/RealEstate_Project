{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Property</title>
    <link rel="stylesheet" href="{% static 'propertytrack/styles.css' %}">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="{% static 'propertytrack/logo_90.jpg' %}" alt="Logo">
        </div>
        <div class="user-info">
            <span>{{ request.user.username }}</span>
            <form action="{% url 'agents:logout' %}" method="post" style="margin: 0; margin-left: 20px;">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        </div>
    </div>
    
    <h1>Edit Property</h1>
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="address" value="{{ rental.address }}" required>
        <input type="number" name="rent_amount" value="{{ rental.rent_amount }}" step="0.01" required>
        <button type="submit">Save</button>
    </form>
    
    <a href="{% url 'propertytrack:rental_detail' rental.id %}">Back</a>
</body>
</html>
